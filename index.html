<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <meta name="description" content="Portes">
    <title>Portes</title>

    <meta property="og:title" content="Portes">
    <meta property="og:description" content="Une fille trouve des portes dans un espace imaginaire.">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="title-screen" class="title-screen">
        <div class="title-content">
            <img src="img/door108.png" alt="Portes" class="title-image">
            <h1 class="title-main">PORTES</h1>

            <div id="title-buttons" class="title-buttons">
            </div>
        </div>
    </div>

    <div id="confirm-popup" class="popup-overlay">
        <div class="popup-content">
            <p class="popup-text">Cela va effacer toute ta progression. Continuer ?</p>
            <div class="popup-actions">
                <button id="btn-confirm-yes" class="popup-btn yes">>> Oui</button>
                <button id="btn-confirm-no" class="popup-btn no">>> Non</button>
            </div>
        </div>
    </div>


    <button id="btn-prev" class="nav-btn" style="display: none;">&lt;&lt; Précédent</button>

    <div id="inventory-container" class="inventory-box">
        <div class="inventory-grid" id="inventory-grid">
            <div class="slot" data-id="lumiere"></div>
            <div class="slot" data-id="tenebres"></div>
            <div class="slot" data-id="normalite"></div>
            <div class="slot" data-id="occcultisme"></div>
            <div class="slot" data-id="creation"></div>
            <div class="slot" data-id="objet"></div>
            <div class="slot" data-id="infini"></div>
            <div class="slot" data-id="resilience"></div>
        </div>
    </div>

    <main class="story-container">
            
        <div class="scene">
            <p class="narration"></p>
        </div>

        <div class="choices">
            <button class="choice-btn"></button>
            <button class="choice-btn"></button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
